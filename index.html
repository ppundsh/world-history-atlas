          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india france egypt iran turkey uk mexico morocco brazil argentina thailand indonesia philippines"><input type="checkbox" id="lc-us" /><i></i><span id="l-lc-us"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india france egypt iran turkey uk mexico morocco brazil argentina thailand indonesia philippines"><input type="checkbox" id="lc-works" /><i></i><span id="l-lc-works"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india france egypt iran turkey uk mexico morocco brazil argentina thailand indonesia philippines"><input type="checkbox" id="lc-network" /><i></i><span id="l-lc-network"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india france egypt iran turkey uk mexico morocco brazil argentina thailand indonesia philippines"><input type="checkbox" id="lc-backbone" /><i></i><span id="l-lc-backbone"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india france egypt iran turkey uk mexico morocco brazil argentina thailand indonesia philippines"><input type="checkbox" id="lc-plants" /><i></i><span id="l-lc-plants"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india france egypt iran turkey uk mexico morocco brazil argentina thailand indonesia philippines"><input type="checkbox" id="lc-zones" /><i></i><span id="l-lc-zones"></span></label>
        </div>
      </div></div>
      <div class="showpick"><button id="showBtn" type="button" class="text"></button>
      <div class="toggles" id="showMenu" hidden>
        <label class="chk"><input type="checkbox" id="t-labels" /><span id="l-labels"></span></label>
        <label id="relLabelsBox" class="sel" hidden><span id="l-relLabels"></span><select id="relLabels"></select></label>
        <label class="chk"><input type="checkbox" id="t-labelsIn" /><span id="l-labelsIn"></span></label>
        <label class="chk"><input type="checkbox" id="t-borders" /><span id="l-borders"></span></label>
        <label class="chk"><input type="checkbox" id="t-rivers" /><span id="l-rivers"></span></label>
        <label class="chk"><input type="checkbox" id="t-graticule" /><span id="l-graticule"></span></label>
        <label class="chk"><input type="checkbox" id="t-modern" /><span id="l-modern"></span></label>
        <label class="chk"><input type="checkbox" id="t-distort" /><span id="l-distort"></span></label>
        <label id="distortBox" class="sel" hidden><span id="l-distortStr"></span><input id="distortStr" type="range" min="0.1" max="1" step="0.05" /></label>
        <label class="chk" hidden><input type="checkbox" id="t-twCompare" /><span id="l-twCompare"></span></label>
        <label class="chk"><input type="checkbox" id="t-relief" /><span id="l-relief"></span></label>
        <label class="chk"><input type="checkbox" id="t-minFont" /><span id="l-minFont"></span></label>
        <label class="chk"><input type="checkbox" id="t-animate" /><span id="l-animate"></span></label>
      </div></div>
      <button id="moreBtn" class="text morebtn" type="button" aria-expanded="false"></button>
      <button id="aboutBtn" class="text"></button>
      <div id="musicFold" hidden><button id="musicToggle" type="button"></button><div id="musicSlot" hidden></div></div>
    </div>
  </header>

  <main id="stage">
    <canvas id="flat"></canvas>
    <div id="globe" hidden></div>
    <canvas id="globe-labels" hidden></canvas>
    <aside id="evTable" hidden></aside>

    <div id="projTags"></div>
    <div id="hud">
      <div id="yearBig"></div>
      <div id="ticker" hidden></div>
      <div id="countBox"><span id="countLabel"></span> <b id="countNum"></b></div>
      <div id="growBox" hidden></div>
    </div>

    <div id="zoomCtl" class="mapctl">
      <button id="zin">＋</button>
      <button id="zout">－</button>
      <button id="lockBtn" hidden>🔒</button>
      <button id="north" hidden>⬆</button>
      <button id="reset">⟲</button>
      <button id="full">⛶</button>
      <button id="shotBtn">📷</button>
      <button id="recBtn"><span class="dot"></span></button>
    </div>
    <div id="evPop" hidden></div>
    <div id="recMenu" hidden><label class="chk"><input type="checkbox" id="recMusic" /><span id="l-recMusic"></span></label><button id="recGo"></button></div>
    <div id="recBar" hidden><span class="dot"></span><span id="recTime">0:00</span><button id="recStop"></button></div>

    <aside id="pinInfo" hidden></aside>
    <div id="evHover" hidden></div>
    <aside id="info" hidden></aside>
    <aside id="legend" hidden></aside>
    <div id="tooltip" hidden></div>
    <div id="busy" hidden><div class="spinner small"></div></div>
  </main>

  <footer id="timeline">
    <div class="buttons ios">
      <button id="start" class="icon tbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5.8v12.4a.8.8 0 0 1-1.2.7L9.5 12.7a.8.8 0 0 1 0-1.4l8.3-6.2a.8.8 0 0 1 1.2.7z"/></svg></button>
      <button id="back" class="icon tbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 6.2v11.6a.8.8 0 0 1-1.3.6L3 12.6a.8.8 0 0 1 0-1.2l7.2-5.8a.8.8 0 0 1 1.3.6zm9 0v11.6a.8.8 0 0 1-1.3.6L12 12.6a.8.8 0 0 1 0-1.2l7.2-5.8a.8.8 0 0 1 1.3.6z"/></svg></button>
      <button id="play" class="icon play"><span class="i-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11.2-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z"/></svg></span><span class="i-pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.4a.6.6 0 0 1 .6.6v12.8a.6.6 0 0 1-.6.6H7a.6.6 0 0 1-.6-.6V5.6A.6.6 0 0 1 7 5zm6.6 0H17a.6.6 0 0 1 .6.6v12.8a.6.6 0 0 1-.6.6h-3.4a.6.6 0 0 1-.6-.6V5.6a.6.6 0 0 1 .6-.6z"/></svg></span></button>
      <button id="fwd" class="icon tbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 6.2v11.6a.8.8 0 0 0 1.3.6l7.2-5.8a.8.8 0 0 0 0-1.2l-7.2-5.8a.8.8 0 0 0-1.3.6zm-9 0v11.6a.8.8 0 0 0 1.3.6L12 12.6a.8.8 0 0 0 0-1.2L4.8 5.6a.8.8 0 0 0-1.3.6z"/></svg></button>
    </div>
    <div class="track">
      <canvas id="spark"></canvas>
      <input id="slider" type="range" min="0" max="10000" step="1" value="0" />
      <div id="evmarks"></div>
      <div id="ticks"></div>
    </div>
    <div class="side">
      <input id="yearInput" type="number" step="1" />
      <label class="speed"><span id="l-speed"></span><select id="speed"></select></label>
      <div id="music" hidden>
        <button id="musicBtn" class="icon">♫</button>
        <select id="trackSel"></select>
        <button id="nextTrack" class="icon">⏭</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </div>
    </div>
    <div id="trackInfo"></div>
  </footer>

  <div id="about" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <header><h2 id="aboutTitle"></h2><button id="aboutX" class="xbtn" aria-label="close">×</button></header>
      <div class="body">
        <p id="aboutWhy"></p>
        <blockquote id="aboutQuote"><p id="aboutQuoteText"></p><p class="orig" lang="fr">« L'incompréhension du présent naît fatalement de l'ignorance du passé. »</p><cite id="aboutQuoteBy"></cite></blockquote>
        <p id="aboutText"></p>
        <p id="countNote"></p>
        <section id="wikiStats"></section>
        <div id="credits"></div>
        <p id="aboutHint" class="hint"></p>
      </div>
      <footer><button id="aboutClose"></button></footer>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
