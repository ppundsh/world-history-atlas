<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>世界國家演變 — 互動式歷史地圖</title>
  <meta name="description" content="從西元前 3400 年到 2026 年，全世界國家疆域的演變。可切換地圖投影、3D 地球與多國語言。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233a7bd5'/%3E%3Cpath d='M6 13c4-3 8 1 11-2s7 1 9 0M5 19c5 2 8-2 12 1s6 0 10-1' stroke='%23f2d16b' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
</head>
<body data-base="plain">
  <div id="loading"><div class="spinner"></div></div>

  <header id="top">
    <div class="brand">
      <h1 id="title">世界國家演變</h1>
      <span id="subtitle"></span>
    </div>
    <button id="menuBtn" class="icon" aria-label="menu">☰</button>
    <div id="controls">
      <label class="modesel"><span id="l-mode"></span><select id="mode"></select></label>
      <div id="layerBox" class="layerbox" hidden><span id="l-layer"></span><label class="chk"><input type="checkbox" id="ly-control" /><span id="l-ly-control"></span></label><label class="chk"><input type="checkbox" id="ly-admin" /><span id="l-ly-admin"></span></label><label class="chk" id="overseasBox" hidden><input type="checkbox" id="ov-japan" /><span id="l-overseas"></span></label></div>
      <label><span id="l-lang"></span><select id="lang"></select></label>
      <label><span id="l-projBy"></span><select id="projBy"></select></label>
      <div class="projpick"><span id="l-proj"></span><button id="projBtn" type="button" aria-haspopup="listbox"></button>
        <div id="projMenu" hidden><div class="plist" role="listbox"></div><div class="pdetail"></div></div></div>
      <label id="bearingBox" hidden><span id="l-bearing"></span><select id="bearing"></select></label>
      <label><span id="l-base"></span><select id="base"></select></label>
      <label><span id="l-pov"></span><select id="pov"></select></label>
      <label><span id="l-density"></span><input id="density" type="range" min="0.1" max="1" step="0.05" /></label>
      <div class="showpick"><button id="showBtn" type="button" class="text"></button>
      <div class="toggles" id="showMenu" hidden>
        <label class="chk"><input type="checkbox" id="t-labels" /><span id="l-labels"></span></label>
        <label id="relLabelsBox" class="sel" hidden><span id="l-relLabels"></span><select id="relLabels"></select></label>
        <label class="chk"><input type="checkbox" id="t-borders" /><span id="l-borders"></span></label>
        <label class="chk"><input type="checkbox" id="t-rivers" /><span id="l-rivers"></span></label>
        <label class="chk"><input type="checkbox" id="t-graticule" /><span id="l-graticule"></span></label>
        <label class="chk"><input type="checkbox" id="t-modern" /><span id="l-modern"></span></label>
        <label class="chk"><input type="checkbox" id="t-minFont" /><span id="l-minFont"></span></label>
        <label class="chk"><input type="checkbox" id="t-animate" /><span id="l-animate"></span></label>
        <label class="chk"><input type="checkbox" id="t-events" /><span id="l-events"></span></label>
      </div></div>
      <button id="aboutBtn" class="text"></button>
    </div>
  </header>

  <main id="stage">
    <canvas id="flat"></canvas>
    <div id="globe" hidden></div>
    <canvas id="globe-labels" hidden></canvas>

    <div id="projTags"></div>
    <div id="hud">
      <div id="yearBig"></div>
      <div id="ticker" hidden></div>
      <div id="countBox"><span id="countLabel"></span> <b id="countNum"></b></div>
    </div>

    <div id="zoomCtl" class="mapctl">
      <button id="zin">＋</button>
      <button id="zout">－</button>
      <button id="lockBtn" hidden>🔒</button>
      <button id="north" hidden>⬆</button>
      <button id="reset">⟲</button>
      <button id="full">⛶</button>
    </div>

    <aside id="info" hidden></aside>
    <aside id="legend" hidden></aside>
    <div id="tooltip" hidden></div>
    <div id="busy" hidden><div class="spinner small"></div></div>
  </main>

  <footer id="timeline">
    <div class="buttons">
      <button id="start" class="icon">⏮</button>
      <button id="back" class="icon">◀</button>
      <button id="play" class="icon play"><span class="i-play">▶</span><span class="i-pause">❚❚</span></button>
      <button id="fwd" class="icon">▶</button>
    </div>
    <div class="track">
      <canvas id="spark"></canvas>
      <input id="slider" type="range" min="0" max="10000" step="1" value="0" />
      <div id="evmarks"></div>
      <div id="ticks"></div>
    </div>
    <div class="side">
      <input id="yearInput" type="number" step="1" />
      <label class="speed"><span id="l-speed"></span><select id="speed"></select></label>
      <div id="music" hidden>
        <button id="musicBtn" class="icon">♫</button>
        <select id="trackSel"></select>
        <button id="nextTrack" class="icon">⏭</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </div>
    </div>
    <div id="trackInfo"></div>
  </footer>

  <div id="about" hidden>
    <div class="card">
      <p id="aboutText"></p>
      <p id="countNote"></p>
      <p class="small">Cliopatria © Seshat Global History Databank, CC BY 4.0 · Natural Earth (public domain) · NASA Earth Observatory Blue Marble (public domain) · Wikidata (CC0) · © OpenStreetMap contributors (ODbL, Taiwan rivers) · MapLibre GL JS (BSD-3) · d3-geo (ISC)</p>
      <button id="aboutClose"></button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
