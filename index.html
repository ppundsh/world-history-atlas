<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>世界國家演變 — 互動式歷史地圖</title>
  <meta name="description" content="從西元前 3400 年到 2026 年，全世界國家疆域的演變。可切換地圖投影、3D 地球與多國語言。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233a7bd5'/%3E%3Cpath d='M6 13c4-3 8 1 11-2s7 1 9 0M5 19c5 2 8-2 12 1s6 0 10-1' stroke='%23f2d16b' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
  <!-- shown before the scripts and the main stylesheet arrive, so the page never flashes unstyled -->
  <style>
    html:not(.ready) body > :not(#loading) { visibility: hidden; }
    html, body { background: #0f1724; }
    #loading { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: radial-gradient(ellipse at 50% 40%, #1d3354 0%, #0f1724 70%); color: #e8eef7; font: 15px system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; transition: opacity .45s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .globe { width: 84px; height: 84px; border-radius: 50%; position: relative; overflow: hidden;
      background: radial-gradient(circle at 35% 30%, #6fa8ff 0%, #2f6fd0 45%, #173d7a 100%); box-shadow: 0 0 0 3px rgba(242,209,107,.35), 0 0 40px rgba(80,150,255,.35); }
    #loading .globe::before, #loading .globe::after { content: ''; position: absolute; top: 0; bottom: 0; width: 200%; left: 0;
      background: radial-gradient(ellipse 14% 22% at 12% 35%, #f2d16b 60%, transparent 62%), radial-gradient(ellipse 10% 16% at 30% 65%, #f2d16b 60%, transparent 62%), radial-gradient(ellipse 18% 14% at 42% 30%, #f2d16b 60%, transparent 62%);
      background-size: 50% 100%; background-repeat: repeat-x; opacity: .85; animation: whaDrift 4s linear infinite; }
    #loading .globe::after { opacity: .35; animation-duration: 7s; top: 10%; }
    @keyframes whaDrift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    #loading .lt { font-size: 22px; font-weight: 700; letter-spacing: .08em; font-family: "Noto Serif TC", Georgia, serif; }
    #loading .bar { width: min(260px, 60vw); height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 4%; background: linear-gradient(90deg, #f2d16b, #ffb74d); border-radius: 2px; transition: width .35s ease-out; }
    #loading .msg { font-size: 12.5px; color: #9fb0c8; min-height: 1.4em; }
  </style>
</head>
<body data-base="plain">
  <div id="loading"><div class="globe"></div><div class="lt">世界國家演變</div><div class="bar"><i id="loadBar"></i></div><div class="msg" id="loadMsg">載入中… Loading…</div></div>
  <script>
    // if loading fails, say so instead of spinning forever
    addEventListener('unhandledrejection', () => { const m = document.getElementById('loadMsg'); if (m && !document.documentElement.classList.contains('ready')) m.textContent = '載入失敗，請重新整理頁面 · Loading failed, please reload'; });
  </script>

  <header id="top">
    <div class="brand">
      <h1 id="title">世界國家演變</h1>
      <span id="subtitle"></span>
    </div>
    <button id="menuBtn" class="icon" aria-label="menu">☰</button>
    <div id="controls">
      <label class="modesel"><span id="l-mode"></span><select id="mode"></select></label><button id="toWorld" class="toworld" hidden></button>
      <div id="layerBox" class="layerbox" hidden><span id="l-layer"></span><label class="chk"><input type="checkbox" id="ly-control" /><span id="l-ly-control"></span></label><label class="chk"><input type="checkbox" id="ly-admin" /><span id="l-ly-admin"></span></label><label class="chk" id="partyBox" hidden><input type="checkbox" id="ly-party" /><span id="l-ly-party"></span></label><label class="chk" id="overseasBox" hidden><input type="checkbox" id="ov-japan" /><span id="l-overseas"></span></label></div>
      <label><span id="l-lang"></span><select id="lang"></select></label>
      <label><span id="l-projBy"></span><select id="projBy"></select></label>
      <div class="projpick"><span id="l-proj"></span><button id="projBtn" type="button" aria-haspopup="listbox"></button>
        <div id="projMenu" hidden><div class="plist" role="listbox"></div><div class="pdetail"></div></div></div>
      <label id="bearingBox" hidden><span id="l-bearing"></span><select id="bearing"></select></label>
      <label><span id="l-base"></span><select id="base"></select></label>
      <label><span id="l-pov"></span><select id="pov"></select></label>
      <label><span id="l-density"></span><input id="density" type="range" min="0.1" max="1" step="0.05" /></label>
      <div class="showpick markpick"><button id="markBtn" type="button" class="text"></button>
      <div class="toggles marks" id="markMenu" hidden>
        <h5 id="l-markGeneral"></h5>
        <label class="switch" id="capSwitch"><input type="checkbox" id="t-capitals" /><i></i><span id="l-capitals"></span></label>
        <label class="switch" id="dotSwitch"><input type="checkbox" id="t-evDots" /><i></i><span id="l-evDots"></span></label>
        <label class="switch" id="evSwitch"><input type="checkbox" id="t-evTable" /><i></i><span id="l-evTable"></span></label>
        <label class="switch"><input type="checkbox" id="t-events" /><i></i><span id="l-events"></span></label>
        <label class="switch"><input type="checkbox" id="t-pics" /><i></i><span id="l-pics"></span></label>
        <label class="picsize"><span id="l-picSize"></span><input id="picSize" type="range" min="30" max="140" step="2" /></label>
        <div id="modeMarks">
          <h5 id="l-markMode"></h5>
          <label class="switch" data-modes="art fgo finance"><input type="checkbox" id="t-artPics" /><i></i><span id="l-artPics"></span></label>
          <label class="switch" data-modes="language finance internet"><input type="checkbox" id="t-thAreas" /><i></i><span id="l-thAreas"></span></label>
          <label class="switch" data-modes="language finance internet"><input type="checkbox" id="t-thFlows" /><i></i><span id="l-thFlows"></span></label>
          <label class="switch" data-modes="language finance internet"><input type="checkbox" id="t-thPoints" /><i></i><span id="l-thPoints"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india"><input type="checkbox" id="t-warFlows" /><i></i><span id="l-warFlows"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india"><input type="checkbox" id="lc-feud" /><i></i><span id="l-lc-feud"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india"><input type="checkbox" id="lc-power" /><i></i><span id="l-lc-power"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india"><input type="checkbox" id="lc-us" /><i></i><span id="l-lc-us"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india"><input type="checkbox" id="lc-works" /><i></i><span id="l-lc-works"></span></label>
          <label class="switch" data-modes="china prc usa taiwan japan russia korea vietnam germany poland italy spain india"><input type="checkbox" id="lc-network" /><i></i><span id="l-lc-network"></span></label>
        </div>
      </div></div>
      <div class="showpick"><button id="showBtn" type="button" class="text"></button>
      <div class="toggles" id="showMenu" hidden>
        <label class="chk"><input type="checkbox" id="t-labels" /><span id="l-labels"></span></label>
        <label id="relLabelsBox" class="sel" hidden><span id="l-relLabels"></span><select id="relLabels"></select></label>
        <label class="chk"><input type="checkbox" id="t-labelsIn" /><span id="l-labelsIn"></span></label>
        <label class="chk"><input type="checkbox" id="t-borders" /><span id="l-borders"></span></label>
        <label class="chk"><input type="checkbox" id="t-rivers" /><span id="l-rivers"></span></label>
        <label class="chk"><input type="checkbox" id="t-graticule" /><span id="l-graticule"></span></label>
        <label class="chk"><input type="checkbox" id="t-modern" /><span id="l-modern"></span></label>
        <label class="chk"><input type="checkbox" id="t-distort" /><span id="l-distort"></span></label>
        <label id="distortBox" class="sel" hidden><span id="l-distortStr"></span><input id="distortStr" type="range" min="0.1" max="1" step="0.05" /></label>
        <label class="chk"><input type="checkbox" id="t-twCompare" /><span id="l-twCompare"></span></label>
        <label class="chk"><input type="checkbox" id="t-relief" /><span id="l-relief"></span></label>
        <label class="chk"><input type="checkbox" id="t-minFont" /><span id="l-minFont"></span></label>
        <label class="chk"><input type="checkbox" id="t-animate" /><span id="l-animate"></span></label>
      </div></div>
      <button id="aboutBtn" class="text"></button>
      <div id="musicFold" hidden><button id="musicToggle" type="button"></button><div id="musicSlot" hidden></div></div>
    </div>
  </header>

  <main id="stage">
    <canvas id="flat"></canvas>
    <div id="globe" hidden></div>
    <canvas id="globe-labels" hidden></canvas>
    <aside id="evTable" hidden></aside>

    <div id="projTags"></div>
    <div id="hud">
      <div id="yearBig"></div>
      <div id="ticker" hidden></div>
      <div id="countBox"><span id="countLabel"></span> <b id="countNum"></b></div>
    </div>

    <div id="zoomCtl" class="mapctl">
      <button id="zin">＋</button>
      <button id="zout">－</button>
      <button id="lockBtn" hidden>🔒</button>
      <button id="north" hidden>⬆</button>
      <button id="reset">⟲</button>
      <button id="full">⛶</button>
      <button id="shotBtn">📷</button>
      <button id="recBtn"><span class="dot"></span></button>
    </div>
    <div id="evPop" hidden></div>
    <div id="recMenu" hidden><label class="chk"><input type="checkbox" id="recMusic" /><span id="l-recMusic"></span></label><button id="recGo"></button></div>
    <div id="recBar" hidden><span class="dot"></span><span id="recTime">0:00</span><button id="recStop"></button></div>

    <aside id="pinInfo" hidden></aside>
    <div id="evHover" hidden></div>
    <aside id="info" hidden></aside>
    <aside id="legend" hidden></aside>
    <div id="tooltip" hidden></div>
    <div id="busy" hidden><div class="spinner small"></div></div>
  </main>

  <footer id="timeline">
    <div class="buttons ios">
      <button id="start" class="icon tbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5.8v12.4a.8.8 0 0 1-1.2.7L9.5 12.7a.8.8 0 0 1 0-1.4l8.3-6.2a.8.8 0 0 1 1.2.7z"/></svg></button>
      <button id="back" class="icon tbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 6.2v11.6a.8.8 0 0 1-1.3.6L3 12.6a.8.8 0 0 1 0-1.2l7.2-5.8a.8.8 0 0 1 1.3.6zm9 0v11.6a.8.8 0 0 1-1.3.6L12 12.6a.8.8 0 0 1 0-1.2l7.2-5.8a.8.8 0 0 1 1.3.6z"/></svg></button>
      <button id="play" class="icon play"><span class="i-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11.2-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z"/></svg></span><span class="i-pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.4a.6.6 0 0 1 .6.6v12.8a.6.6 0 0 1-.6.6H7a.6.6 0 0 1-.6-.6V5.6A.6.6 0 0 1 7 5zm6.6 0H17a.6.6 0 0 1 .6.6v12.8a.6.6 0 0 1-.6.6h-3.4a.6.6 0 0 1-.6-.6V5.6a.6.6 0 0 1 .6-.6z"/></svg></span></button>
      <button id="fwd" class="icon tbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 6.2v11.6a.8.8 0 0 0 1.3.6l7.2-5.8a.8.8 0 0 0 0-1.2l-7.2-5.8a.8.8 0 0 0-1.3.6zm-9 0v11.6a.8.8 0 0 0 1.3.6L12 12.6a.8.8 0 0 0 0-1.2L4.8 5.6a.8.8 0 0 0-1.3.6z"/></svg></button>
    </div>
    <div class="track">
      <canvas id="spark"></canvas>
      <input id="slider" type="range" min="0" max="10000" step="1" value="0" />
      <div id="evmarks"></div>
      <div id="ticks"></div>
    </div>
    <div class="side">
      <input id="yearInput" type="number" step="1" />
      <label class="speed"><span id="l-speed"></span><select id="speed"></select></label>
      <div id="music" hidden>
        <button id="musicBtn" class="icon">♫</button>
        <select id="trackSel"></select>
        <button id="nextTrack" class="icon">⏭</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </div>
    </div>
    <div id="trackInfo"></div>
  </footer>

  <div id="about" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <header><h2 id="aboutTitle"></h2><button id="aboutX" class="xbtn" aria-label="close">×</button></header>
      <div class="body">
        <p id="aboutText"></p>
        <p id="countNote"></p>
        <div id="credits"></div>
      </div>
      <footer><button id="aboutClose"></button></footer>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
